name: NXLog Agent
slug: nxlog-agent

description: >-
  Logs generated by the NXLog agent itself: File Integrity Monitoring events (im_fim module) and internal logs of the agent (im_internal module).

data_sources:
  File monitoring: the File Integrity Monitoring module (im_fim) reports file creations, changes, renames and deletions with their digests
  Sensor health and status: internal logs of the agent report the File Integrity Monitoring scans and the collection errors
