description: >-
  Events of the CybelAngel External Risk Protection platform: the incident reports sent by CybelAngel (leaked credentials and documents, exposed services and databases, malicious websites...) and the audit logs of the platform (logins and actions of the users on the reports, the keywords and the users).

data_sources:
  Application logs: the incident reports describe the external threats detected by CybelAngel, and the audit logs report the actions of the users on the platform
  Authentication logs: the audit logs report the logins and logouts of the users of the CybelAngel platform
