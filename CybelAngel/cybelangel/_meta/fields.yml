cybelangel.audit.event_id:
  description: Unique identifier of the audit log event
  name: cybelangel.audit.event_id
  type: keyword

cybelangel.audit.object.id:
  description: Identifier of the object the action was performed on
  name: cybelangel.audit.object.id
  type: keyword

cybelangel.audit.object.type:
  description: Type of the object the action was performed on (report, keyword or
    user)
  name: cybelangel.audit.object.type
  type: keyword

cybelangel.audit.updated_fields:
  description: Fields updated by an update action
  name: cybelangel.audit.updated_fields
  type: keyword

cybelangel.keyword.name:
  description: Name of the keyword the action was performed on
  name: cybelangel.keyword.name
  type: keyword

cybelangel.keyword.type:
  description: Type of the keyword the action was performed on
  name: cybelangel.keyword.type
  type: keyword

cybelangel.report.abstract:
  description: Summary of the incident
  name: cybelangel.report.abstract
  type: keyword

cybelangel.report.id:
  description: Unique identifier of the report
  name: cybelangel.report.id
  type: keyword

cybelangel.report.incident_id:
  description: Incident identifier of the report, unique within the organization
  name: cybelangel.report.incident_id
  type: keyword

cybelangel.report.incident_type:
  description: Type of the incident (e.g. credentials, exposed_service, malicious_website)
  name: cybelangel.report.incident_type
  type: keyword

cybelangel.report.registrar_name:
  description: Registrar of the domain related to the incident
  name: cybelangel.report.registrar_name
  type: keyword

cybelangel.report.report_type:
  description: Type of the report (incident_report, incident_detection, preliminary_report,
    reminder, communication)
  name: cybelangel.report.report_type
  type: keyword

cybelangel.report.severity:
  description: Severity of the report an audited action was performed on, from 0 (low)
    to 4 (high)
  name: cybelangel.report.severity
  type: number

cybelangel.report.status:
  description: Status of the report (draft, open, in_progress, resolved, discarded)
  name: cybelangel.report.status
  type: keyword

cybelangel.report.threat:
  description: Threat related to the incident
  name: cybelangel.report.threat
  type: keyword

cybelangel.report.workspaces:
  description: Names of the CybelAngel workspaces of the report
  name: cybelangel.report.workspaces
  type: keyword
